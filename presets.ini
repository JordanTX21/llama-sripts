; llama.cpp INI Presets
; Compatible with all .bat and .sh scripts in this directory
;
; Usage:
;   llama-server --preset presets.ini:SectionName
;   llama-server --models-preset presets.ini
;
; model  = path to the GGUF model file (relative to scripts/)
; mmproj = path to the multimodal projector / vision encoder
;
; Based on: https://github.com/ggml-org/llama.cpp/blob/master/docs/preset.md

[*]
top-p               = 0.95
min-p               = 0.0
presence-penalty    = 0.0
repeat-penalty      = 1.0
ngl                 = 999
fit                 = 0
cache-type-k        = q8_0
cache-type-v        = q8_0
cache-idle-slots    = 1
kv-unified          = 1
lv                  = 4

[Qwen3.6-35B-A3B]
model               = ../models/Qwen/Qwen3.6-35B-A3B/Qwen3.6-35B-A3B-MXFP4_MOE.gguf
n-cpu-moe           = 30
reasoning           = 1
cache-type-k        = q8_0
cache-type-v        = q8_0
cache-type-k-draft  = q8_0
cache-type-v-draft  = q8_0
spec-type           = draft-mtp
spec-draft-n-max    = 2
temp                = 0.6
top-k               = 20
parallel            = 1

[Qwen3.5-9B]
model               = ../models/Qwen/Qwen3.5-9B/Qwen3.5-9B-UD-Q4_K_XL.gguf
mmproj              = ../models/Qwen/Qwen3.5-9B/mmproj-BF16.gguf
reasoning           = 1
cache-type-k        = q8_0
cache-type-v        = q8_0
cache-type-k-draft  = q8_0
cache-type-v-draft  = q8_0
spec-type           = draft-mtp
spec-draft-n-max    = 2
temp                = 0.6
top-k               = 20
parallel            = 1
image-min-tokens    = 1024

[Qwen3.5-4B]
model               = ../models/Qwen/Qwen3.5-4B/Qwen3.5-4B-UD-Q4_K_XL.gguf
mmproj              = ../models/Qwen/Qwen3.5-4B/mmproj-BF16.gguf
reasoning           = 1
cache-type-k        = q8_0
cache-type-v        = q8_0
cache-type-k-draft  = q8_0
cache-type-v-draft  = q8_0
spec-type           = draft-mtp
spec-draft-n-max    = 2
temp                = 0.6
top-k               = 20
parallel            = 1
image-min-tokens    = 1024

[Gemma-4-12B]
model               = ../models/Gemma/Gemma4-12B/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
mmproj              = ../models/Gemma/Gemma4-12B/mmproj-BF16.gguf
model-draft         = ../models/Gemma/Gemma4-12B/mtp-gemma-4-12B-it-Q4_0.gguf
reasoning           = 1
cache-type-k        = q8_0
cache-type-v        = q8_0
cache-type-k-draft  = q8_0
cache-type-v-draft  = q8_0
spec-type           = draft-mtp
spec-draft-n-max    = 4
temp                = 1.0
top-k               = 64
parallel            = 4

[Bonzai-27B]
model                   = ../models/Prism/Ternary-Bonsai/Ternary-Bonsai-27B-Q2_0.gguf
fit                     = 1
cache-type-k            = q4_0
cache-type-v            = q4_0
parallel                = 1
jinja                   = 1
temp                    = 0.7
top-k                   = 20
min-p                   = 0
device                  = CUDA0
spec-type               = ngram-mod
spec-ngram-mod-n-min    = 48
spec-ngram-mod-n-max    = 64
spec-ngram-mod-n-match  = 24
reasoning               = 1

